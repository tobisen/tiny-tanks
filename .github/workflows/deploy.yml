name: Test and deploy Tiny Tanks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify seeded Mayhem match balance
        run: npm run balance:mayhem
      - name: Verify Arsenal pacing and aggregate damage budgets
        run: npm run balance:arsenal
      - run: npm run typecheck
      - run: npm run typecheck:browser
      - run: npm run build
      - name: Install browser for release verification
        run: npx playwright install --with-deps chromium
      - name: Verify gameplay and offline production build
        run: npm run test:browser
      - name: Repeat complete browser suite before release
        run: npm run test:browser
      - name: Preserve browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
